server:
  port: 8080

spring:
  application:
    name: api-gateway
  profiles:
    active: local
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      discovery:
        locator:
          enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: auth-service
        url: /v3/api-docs/auth
      - name: inventory-service
        url: /v3/api-docs/inventory
      - name: order-service
        url: /v3/api-docs/order
      - name: notification-service
        url: /v3/api-docs/notification
      - name: report-service
        url: /v3/api-docs/report

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: ${spring.application.name}:${server.port}:${random.value}

jwt:
  secret: ${JWT_SECRET:185ee9a8b7197f600752e1deb44cb3dfe89b14d1664f18ed85fc17d1a9c861ab}

logging:
  level:
    org.springframework.cloud.gateway: INFO
